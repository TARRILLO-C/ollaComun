# =====================================================================
# EcoFood MVP - Configuración de Spring Boot con MySQL 8+ y JPA Spatial
# =====================================================================

server.port=8080

# ---------------------------------------------------------------------
# 1. Configuración del DataSource para MySQL 8+
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3307/ecofood_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------
# 2. Creación Automática de Tablas en JPA (CRÍTICO) par cerar las tablas ne automatico solo se tiene que iniciar secion 
# ---------------------------------------------------------------------
# "update": Crea las tablas y columnas automáticamente si no existen
# y actualiza el esquema sin borrar datos existentes.
spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------------
# 3. Dialecto de Hibernate para Datos Espaciales (MySQL 8+)
# ---------------------------------------------------------------------
# En Spring Boot 3.x / Hibernate 6, MySQLDialect integra nativamente
# el soporte espacial (Geometry / Point) al estar hibernate-spatial en el pom.xml.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# (Si utilizas Spring Boot 2.x / Hibernate 5, descomenta la siguiente línea):
# spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.mysql.MySQL8SpatialDialect

# ---------------------------------------------------------------------
# 4. Logs y Formato de Consultas SQL
# ---------------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Límite para subida de imágenes multipart (Foto de fachada del bodeguero)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
